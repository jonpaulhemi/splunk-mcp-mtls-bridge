# The bridge daemon. It's a single-instance modular input with one fixed stanza, so there is no
# Inputs page. interval is how long splunkd waits before restarting it after it exits.
# Keep interval here only: declaring it in README/inputs.conf.spec makes splunkd ignore it, so the daemon
# isn't restarted (#37). scripts/check_modinput_spec.py checks both files.
# python.required is what Splunk 10.2+ reads; python.version is kept for older checks.
[mtls_bridge_daemon]
interval = 30
python.version = python3
python.required = 3.9, 3.13

[mtls_bridge_daemon://bridge]
disabled = 0
python.version = python3
python.required = 3.9, 3.13

# The bridge's audit trail. The daemon sets index and disabled from the Audit settings page, through splunkd's
# REST API, and writes the file whether or not it's indexed.
[monitor://$SPLUNK_HOME/var/log/TA-mtls-bridge/audit.log]
sourcetype = mtls_bridge:audit
index = main
disabled = 0
