name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Splunk Enterprise 10.4 runs app Python on 3.9 or 3.13.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-build.txt
      - name: Build the app
        run: |
          ucc-gen build --source package --ta-version "$(python -c 'import json; print(json.load(open("globalConfig.json"))["meta"]["version"])')"
          ucc-gen package --path output/TA-mtls-bridge -o output
      - name: AppInspect
        run: |
          splunk-appinspect inspect output/TA-mtls-bridge-*.tar.gz --output-file output/appinspect.json --data-format json
          python scripts/check_appinspect.py output/appinspect.json
      - uses: actions/upload-artifact@v4
        with:
          name: TA-mtls-bridge
          path: output/TA-mtls-bridge-*.tar.gz
