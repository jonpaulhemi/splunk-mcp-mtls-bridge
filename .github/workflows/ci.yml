name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Splunk Enterprise 10.4 runs app Python on 3.9 or 3.13.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-build.txt
      - name: Build the app and run AppInspect
        run: scripts/build_app.sh "$(python -c 'import json; print(json.load(open("globalConfig.json"))["meta"]["version"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: TA-mtls-bridge
          path: output/TA-mtls-bridge-*.tgz
