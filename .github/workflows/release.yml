name: Release

# Pushing a tag such as v1.2.3 tests the code, builds the app at version 1.2.3 and publishes
# TA-mtls-bridge-1.2.3.tgz on a GitHub release for the tag.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        # Refuse tags like v1.2.3-rc1 before spending a CI run on them.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags look like v1.2.3, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TA-mtls-bridge
          path: output
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "output/TA-mtls-bridge-$VERSION.tgz" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
