name: Release

# Pushing a tag such as v1.2.3 tests the code, builds the app at version 1.2.3 and publishes
# TA-mtls-bridge-1.2.3.tgz on a GitHub release for the tag.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-build.txt
      - name: Build the app at the tag's version and run AppInspect
        run: scripts/build_app.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "output/TA-mtls-bridge-${GITHUB_REF_NAME#v}.tgz" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
